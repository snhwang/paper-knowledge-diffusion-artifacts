panel: paper-review
title: "Diffusion MRI of white matter in multiple sclerosis"

# Three CC-BY papers (Scientific Reports); licence statements checked in the
# PDFs, see ../PAPERS.md. Ingested into the shared source store; document
# diffusion offers every chunk to every role's lens.
documents:
  - file: radial-diffusivity-ms-2022.pdf
    title: "Radial diffusivity reflects general decline rather than specific cognitive deterioration in multiple sclerosis (Sci Rep 2022)"
  - file: dti-future-disability-ms-2023.pdf
    title: "Diffusion tensor imaging metrics associated with future disability in multiple sclerosis (Sci Rep 2023)"
  - file: gm-microstructure-duration-ms-2021.pdf
    title: "Regional grey matter microstructural changes and volume loss according to disease duration in multiple sclerosis (Sci Rep 2021)"

prompts:
  - "We have three papers on diffusion MRI of white matter in multiple sclerosis. Synthesizer, what do they find, taken together?"
  - "Methodologist and statistician: how were these studies done, and do the numbers support the claims?"
  - "Skeptic: what is the most consequential limitation across the three, and what alternative explanation should we consider?"
  - "Replicator: which of these could we reproduce from what is reported, and what is missing?"
  - "Which diffusion metric, if any, tracks clinical outcome well enough to be useful, and over what timescale?"
  - "Communicator: what does this evidence mean for someone living with relapsing MS, and what does it not mean?"
  - "Where do the three papers disagree, and what study would settle it?"
