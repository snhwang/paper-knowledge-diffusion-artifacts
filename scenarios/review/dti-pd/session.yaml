panel: paper-review
title: "Diffusion MRI of white matter and deep grey matter in Parkinson's disease"

# Three CC-BY papers (PLOS ONE); licence statements checked in the PDFs, see
# ../PAPERS.md. Ingested into the shared source store; document diffusion
# offers every chunk to every role's lens.
documents:
  - file: dti-progression-pd-2016.pdf
    title: "Progression of regional microstructural degeneration in Parkinson's disease: a multicenter DTI study (PLOS ONE 2016)"
  - file: wm-precedes-gm-pd-2018.pdf
    title: "White matter alterations in Parkinson's disease with normal cognition precede grey matter atrophy (PLOS ONE 2018)"
  - file: dti-rsi-pd-2019.pdf
    title: "Diffusion tensor and restriction spectrum imaging reflect different aspects of neurodegeneration in Parkinson's disease (PLOS ONE 2019)"

prompts:
  - "We have three papers on diffusion MRI in Parkinson's disease. Synthesizer, what do they find, taken together?"
  - "Methodologist and statistician: how were these studies done, and do the numbers support the claims?"
  - "Skeptic: what is the most consequential limitation across the three, and what alternative explanation should we consider?"
  - "Replicator: which of these could we reproduce from what is reported, and what is missing?"
  - "Do the advanced diffusion models add anything over standard DTI in this population, or do they measure the same thing?"
  - "Communicator: what does this evidence mean for someone recently diagnosed, and what does it not mean?"
  - "Where do the three papers disagree, and what study would settle it?"
